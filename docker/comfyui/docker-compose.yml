services:
  comfyui:
    image: yanwk/comfyui-boot:cu130-megapak-pt211
    container_name: comfyui
    restart: unless-stopped
    init: true
    ports:
      - "10011:8188"
    volumes:
      # Standard Data Paths
      - /home/chrisleebear/data/docker/comfyui/output:/root/ComfyUI/output
      - /home/chrisleebear/data/docker/comfyui/input:/root/ComfyUI/input
      - /home/chrisleebear/data/ai/models:/root/ComfyUI/models
      # User Configuration & Workflows
      - /home/chrisleebear/data/docker/comfyui/user:/root/ComfyUI/user
      # Custom Nodes & Python packages (persisted across rebuilds)
      - /home/chrisleebear/data/docker/comfyui/custom_nodes:/root/ComfyUI/custom_nodes
      - /home/chrisleebear/data/docker/comfyui/dot-local:/root/.local
      # User scripts (pre-start / post-start hooks)
      - /home/chrisleebear/data/docker/comfyui/user-scripts:/root/user-scripts
      # CRITICAL CACHES
      # Prevents redownloading HF/Torch files on restart
      - /home/chrisleebear/data/docker/comfyui/cache/huggingface:/root/.cache/huggingface
      - /home/chrisleebear/data/docker/comfyui/cache/torch:/root/.cache/torch
      # Optional: Persist pip cache for faster custom node installs
      - /home/chrisleebear/data/docker/comfyui/cache/pip:/root/.cache/pip
    environment:
      - TZ=Europe/Vienna
      - CLI_ARGS=
    devices:
      - nvidia.com/gpu=all