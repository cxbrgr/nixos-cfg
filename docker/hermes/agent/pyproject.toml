[project]
name = "hermes-agent"
version = "0.1.0"
description = "Hermes voice agent — Pipecat + Gemini Live + LiveKit"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[google,livekit,silero]>=0.0.55",
    "livekit-api>=0.7.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "tools"]
