services:
  hermes-agent:
    build: ./agent
    image: hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - /data/docker/hermes/workspace:/workspace
    environment:
      - HERMES_WORKSPACE=/workspace
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_ROOM=${LIVEKIT_ROOM:-hermes-main}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_VOICE=${GEMINI_VOICE:-Puck}
      - GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-2.0-flash-exp}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Europe/Vienna

  hermes-frontend:
    build: ./frontend
    image: hermes-frontend:latest
    container_name: hermes-frontend
    restart: unless-stopped
    ports:
      - "3737:3000"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_ROOM=${LIVEKIT_ROOM:-hermes-main}
      - TZ=Europe/Vienna
